# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on
set -g allow-rename off
set -g xterm-keys on
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Key bindings
bind R source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"
bind r command-prompt -I '#W' 'rename-window -- %%'
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"
bind b detach-client
bind t new-window -c "#{pane_current_path}"
bind T clock-mode
bind f resize-pane -Z
bind F command-prompt "find-window -Z -- '%%'"
bind x kill-pane
bind X kill-window
unbind c
unbind &
unbind '"'
unbind %

# Visual action menu
bind Space display-menu -T "#[align=centre] Actions Rapides " \
  "Nouvel onglet (t)"           t "new-window -c '#{pane_current_path}'" \
  "Split droite (d)"            d "split-window -h -c '#{pane_current_path}'" \
  "Split bas (D)"               D "split-window -v -c '#{pane_current_path}'" \
  "" \
  "Renommer l'onglet (r)"       r "command-prompt -I '#W' 'rename-window -- %%'" \
  "Changer de session (s)"      s "choose-tree -Zs" \
  "" \
  "Fermer ce panneau (x)"       x "kill-pane" \
  "Fermer cet onglet (X)"       X "kill-window" \
  "Détacher la session (b)"     b "detach-client"

# Fast window navigation
bind -n M-Tab last-window
bind [ previous-window
bind ] next-window
unbind n
unbind p

# Direct pane navigation without prefix (Ctrl + h/j/k/l)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode (Vi)
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Minimal status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=default,fg=default] "
set -g status-right "#[fg=#a6adc8]%H:%M #[fg=#6c7086]| #[fg=#a6adc8]%d-%b"

setw -g window-status-format "#[fg=#6c7086]#I:#W "
setw -g window-status-current-format "#[fg=#a6e3a1,bold]#I:#W* "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect & Continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Auto-install TPM and plugins if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
